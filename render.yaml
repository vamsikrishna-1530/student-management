# Frontend is published to GitHub Pages by GitHub Actions.
# Backend API is published to Render by GitHub Actions (deploy hook).
# See render.yaml for the API + optional Render UI blueprint.

services:
  - type: web
    name: student-management-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        value: https://vamsikrishna-1530.github.io,http://localhost:5173
      # Official classroom org DB — no public self-signup pollution
      - key: ALLOW_PUBLIC_REGISTER
        value: "false"
      - key: ORG_NAME
        value: CampusLedger Demo College
