name: Deploy

# 1) Build & publish Docker images to GHCR (always)
# 2) Trigger Render redeploy via deploy hooks (when secrets exist)
#    → Public URLs on Render free tier

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  deployments: write

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image names
        id: image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "backend=ghcr.io/${OWNER}/${REPO}-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${OWNER}/${REPO}-frontend" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.backend }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Frontend image metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.frontend }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve frontend API URL
        id: api
        run: |
          if [ -n "${{ vars.VITE_API_URL }}" ]; then
            echo "url=${{ vars.VITE_API_URL }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ vars.BACKEND_URL }}" ]; then
            echo "url=${{ vars.BACKEND_URL }}/api" >> "$GITHUB_OUTPUT"
          else
            echo "url=http://localhost:5001/api" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ steps.api.outputs.url }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-render:
    name: Deploy to Render (public URL)
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.FRONTEND_URL }}
    steps:
      - name: Trigger Render backend deploy
        id: backend
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_BACKEND secret is not set."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          echo "Backend deploy hook triggered"

      - name: Trigger Render frontend deploy
        id: frontend
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_FRONTEND secret is not set."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          echo "Frontend deploy hook triggered"

      - name: Deployment URLs
        run: |
          {
            echo "## Public deployment URLs"
            echo ""
            if [ -n "${{ vars.FRONTEND_URL }}" ]; then
              echo "- **Frontend:** ${{ vars.FRONTEND_URL }}"
            else
              echo "- **Frontend:** set repo variable \`FRONTEND_URL\` after first Render deploy"
            fi
            if [ -n "${{ vars.BACKEND_URL }}" ]; then
              echo "- **Backend:** ${{ vars.BACKEND_URL }}"
            else
              echo "- **Backend:** set repo variable \`BACKEND_URL\` after first Render deploy"
            fi
            echo ""
            echo "One-time setup: see [DEPLOY.md](../blob/main/DEPLOY.md)"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}" ] || [ -z "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}" ]; then
            echo "::notice::Render hooks missing — follow DEPLOY.md to create Render services and add secrets. Until then there is no public URL."
          fi

  deploy-ssh:
    name: Deploy to VPS (optional)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_SSH_DEPLOY == 'true' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_DIR" ]; then
              DEPLOY_DIR="$HOME/student-management"
            fi
            cd "$DEPLOY_DIR"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
