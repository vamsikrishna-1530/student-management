name: Deploy GitHub Pages

# Public website URL:
# https://vamsikrishna-1530.github.io/student-management/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve API URL
        id: api
        run: |
          if [ -n "${{ vars.VITE_API_URL }}" ]; then
            echo "url=${{ vars.VITE_API_URL }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ vars.BACKEND_URL }}" ]; then
            echo "url=${{ vars.BACKEND_URL }}/api" >> "$GITHUB_OUTPUT"
          else
            echo "url=http://localhost:5001/api" >> "$GITHUB_OUTPUT"
          fi

      - name: Install & build
        working-directory: frontend
        env:
          VITE_BASE: /student-management/
          VITE_API_URL: ${{ steps.api.outputs.url }}
        run: |
          npm ci
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show public URL
        run: |
          {
            echo "## Public website link"
            echo ""
            echo "**https://vamsikrishna-1530.github.io/student-management/**"
            echo ""
            echo "GitHub Pages URL from deploy step: ${{ steps.deployment.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
